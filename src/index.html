<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cannabis Bibliothek</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/bibliothek" aria-label="Zur Bibliothek">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 21.5v-6.2"></path>
            <path d="M12 15.3c-2.7 0-4.9-1.7-5.9-4.4 2.1.1 3.9.9 5.1 2.3"></path>
            <path d="M12 15.3c2.7 0 4.9-1.7 5.9-4.4-2.1.1-3.9.9-5.1 2.3"></path>
            <path d="M12 13.2C9.9 10.4 9.7 6.9 12 2.5c2.3 4.4 2.1 7.9 0 10.7Z"></path>
          </svg>
        </span>
        <span class="brand-text"><strong>Cannabis</strong><em>Bibliothek</em></span>
      </a>

      <nav class="nav" aria-label="Hauptnavigation">
        <a class="nav-link" href="#/bibliothek" data-nav="bibliothek">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3.5" y="3.5" width="7" height="7" rx="1.6"></rect>
            <rect x="13.5" y="3.5" width="7" height="7" rx="1.6"></rect>
            <rect x="3.5" y="13.5" width="7" height="7" rx="1.6"></rect>
            <rect x="13.5" y="13.5" width="7" height="7" rx="1.6"></rect>
          </svg>
          <span>Bibliothek</span>
        </a>
        <a class="nav-link" href="#/finder" data-nav="finder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3.2 13.9 9l6.1.2-4.9 3.7 1.8 5.9-4.9-3.6-4.9 3.6 1.8-5.9L3.9 9.2 10 9Z"></path>
          </svg>
          <span>Wirkungs-Finder</span>
        </a>
        <a class="nav-link" href="#/vergleich" data-nav="vergleich">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 20V9.5"></path>
            <path d="M10 20V4"></path>
            <path d="M16 20v-7"></path>
            <path d="M21.5 20H2.5"></path>
          </svg>
          <span>Vergleich</span>
        </a>
        <a class="nav-link" href="#/statistik" data-nav="statistik">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5H12Z"></path>
            <path d="M15.5 3.9A8.5 8.5 0 0 1 20.1 8.5h-4.6Z"></path>
          </svg>
          <span>Statistik</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <span class="pill">Offline</span>
        <p>Näherungswerte aus Community-Daten. Keine Laboranalyse, keine medizinische Beratung.</p>
        <span class="age">18+</span>
      </div>
    </aside>

    <div class="content">
      <main id="view" class="view" tabindex="-1"></main>
      <footer class="app-footer">
        <span>Cannabis Bibliothek · v1.0</span>
        <span>Alle Angaben sind Durchschnitts- und Näherungswerte. Konsum erst ab 18 Jahren.</span>
      </footer>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
